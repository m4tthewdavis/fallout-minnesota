name: Build Windows game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache compiled libraries
        uses: Swatinem/rust-cache@v2

      - name: Build the game
        run: cargo build --release

      - name: Run the game-rule tests
        run: cargo test --release

      - name: Check the generated sign layouts
        shell: pwsh
        run: |
          python -m pip install --quiet numpy pillow
          python tools/test_gen_textures.py

      - name: Package the game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fallout_minnesota.exe dist/FalloutMinnesota.exe
          Copy-Item README.md dist/README.md
          # Models, textures, fonts and HUD images must sit next to the .exe.
          Copy-Item -Recurse assets dist/assets

      - name: Check the package has its game files
        shell: pwsh
        run: |
          foreach ($f in @("dist/FalloutMinnesota.exe", "dist/assets/textures/snow_02/diff_clean.jpg", "dist/assets/models/barrel_stove/barrel_stove.gltf")) {
            if (-not (Test-Path $f)) { Write-Error "Missing from the package: $f"; exit 1 }
          }

      - name: Upload the game for download
        uses: actions/upload-artifact@v4
        with:
          name: fallout-minnesota-windows
          path: dist/
          retention-days: 30
