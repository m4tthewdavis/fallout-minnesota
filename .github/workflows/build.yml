name: Build Windows game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache compiled libraries
        uses: Swatinem/rust-cache@v2

      - name: Build the game
        run: cargo build --release

      - name: Run the game-rule tests
        run: cargo test --release

      - name: Package the game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fallout_minnesota.exe dist/FalloutMinnesota.exe
          Copy-Item README.md dist/README.md

      - name: Upload the game for download
        uses: actions/upload-artifact@v4
        with:
          name: fallout-minnesota-windows
          path: dist/
          retention-days: 30
