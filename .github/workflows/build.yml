name: Build Windows game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache compiled libraries
        uses: Swatinem/rust-cache@v2

      - name: Build the game
        run: cargo build --release

      - name: Run the game-rule tests
        run: cargo test --release

      - name: Check the generated sign layouts
        shell: pwsh
        run: |
          python -m pip install --quiet numpy pillow
          python tools/test_gen_textures.py

      - name: Package the game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fallout_minnesota.exe dist/FalloutMinnesota.exe
          Copy-Item README.md dist/README.md
          Copy-Item assets/CREDITS.md dist/CREDITS.md
          # Models, textures, fonts and HUD images must sit next to the .exe.
          Copy-Item -Recurse assets dist/assets
          # One-click performance runs for testing on real hardware. Results go
          # to %APPDATA%\FalloutMinnesota (benchmark.txt, profile.csv).
          Set-Content dist/Benchmark.bat "@echo off`r`necho Flying the 60-second benchmark. The result is written to %APPDATA%\FalloutMinnesota\benchmark.txt`r`nstart /wait FalloutMinnesota.exe --benchmark`r`ntype `"%APPDATA%\FalloutMinnesota\benchmark.txt`"`r`npause"
          Set-Content dist/PlayWithProfile.bat "@echo off`r`nrem Plays normally, logging frame times every 5 seconds to %APPDATA%\FalloutMinnesota\profile.csv`r`nstart FalloutMinnesota.exe --profile"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Set-Content dist/VERSION.txt "Fallout: Minnesota prototype $version ($env:GITHUB_SHA)"

      - name: Check the package has its game files
        shell: pwsh
        run: |
          foreach ($f in @("dist/FalloutMinnesota.exe", "dist/assets/textures/generated/snow_diff.jpg", "dist/assets/models/barrel_stove/barrel_stove.gltf", "dist/assets/textures/generated/flame_sheet.png", "dist/assets/textures/generated/spray_fir.png", "dist/assets/ui/pip_frame.png", "dist/assets/ui/mascot_idle.png", "dist/assets/textures/blue_metal_plate/diff.jpg", "dist/assets/textures/polar_fleece/diff.jpg", "dist/assets/textures/generated/frost_rime.png", "dist/assets/ui/icon.png", "dist/assets/sounds/step_snow_0.ogg", "dist/assets/environment/snow_field_diffuse.ktx2", "dist/assets/environment/snow_field_specular.ktx2", "dist/assets/environment/rural_winter_roadside_diffuse.ktx2", "dist/assets/environment/rural_winter_roadside_specular.ktx2", "dist/assets/textures/Ice003/diff.jpg", "dist/assets/textures/LeafSet019/diff.jpg", "dist/assets/models/boulder_01/boulder_01.gltf", "dist/assets/models/metal_office_desk/metal_office_desk.gltf", "dist/assets/textures/Tiles140/diff.jpg", "dist/CREDITS.md", "dist/Benchmark.bat", "dist/PlayWithProfile.bat", "dist/VERSION.txt")) {
            if (-not (Test-Path $f)) { Write-Error "Missing from the package: $f"; exit 1 }
          }
          # A missing sounds folder would fall back to synthesised sound silently.
          $n = (Get-ChildItem dist/assets/sounds -Filter *.ogg).Count
          if ($n -lt 100) { Write-Error "Only $n recorded sounds in the package"; exit 1 }

      - name: Upload the game for download
        uses: actions/upload-artifact@v4
        with:
          name: fallout-minnesota-windows
          path: dist/
          retention-days: 30
