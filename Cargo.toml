[package]
name = "fallout_minnesota"
version = "0.2.0"
edition = "2021"
description = "Fallout: Minnesota - first-person cold-survival prototype"

[dependencies]
# "wav" lets Bevy play the sound effects the game synthesises at start-up.
# "jpeg" loads the CC0 Poly Haven textures in assets/.
bevy = { version = "0.16", features = ["wav", "jpeg"] }
# Bevy already depends on blake3. The "pure" feature makes it pure Rust, so it
# builds without a C compiler (needed for the lighter GNU toolchain on Windows).
blake3 = { version = "1", features = ["pure"] }
# Settings and save files are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only to hand the window its icon (the same winit Bevy already uses).
winit = { version = "0.30", default-features = false }

# Keep debug builds playable: optimize our code a little, dependencies a lot.
# Debug info is turned off because it is most of the build folder's size
# (several GB with Bevy). Turn it back on if you need a debugger.
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3
debug = false

# The release build that gets packaged: fully optimised, link-time optimised
# across crates, and stripped of symbols (a much smaller .exe).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
